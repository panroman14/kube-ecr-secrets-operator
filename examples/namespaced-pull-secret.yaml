# Pull secret in the object's own namespace; the credentials Secret must be in that namespace too.
apiVersion: aws.zakariaamine.com/v1alpha2
kind: AWSECRImagePullSecret
metadata:
  name: ecr
  namespace: app
spec:
  awsAccess:
    secretName: aws-ecr-credentials
    region: eu-west-1
  secretName: ecr-pull
