# AWS keys of an IAM user with ecr:GetAuthorizationToken + pull rights.
# Better: create it from a file instead of committing keys:
#   kubectl -n default create secret generic aws-ecr-credentials --from-env-file=aws.env
apiVersion: v1
kind: Secret
metadata:
  name: aws-ecr-credentials
  namespace: default
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: AKIAXXXXXXXXXXXXXXXX
  AWS_SECRET_ACCESS_KEY: replace-me
