# One pull secret "ecr-pull" in several namespaces, credentials from default/aws-ecr-credentials.
apiVersion: aws.zakariaamine.com/v1alpha2
kind: ClusterAWSECRImagePullSecret
metadata:
  name: ecr
spec:
  awsAccess:
    secretName: aws-ecr-credentials
    secretNamespace: default
    region: eu-west-1
  secretName: ecr-pull
  namespaces:
    - default
    - app
