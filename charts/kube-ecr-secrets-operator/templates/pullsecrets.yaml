{{- range .Values.pullSecrets }}
---
apiVersion: aws.zakariaamine.com/v1alpha2
kind: ClusterAWSECRImagePullSecret
metadata:
  name: {{ required "pullSecrets[].name is required" .name }}
  labels:
    {{- include "epso.labels" $ | nindent 4 }}
spec:
  awsAccess:
    region: {{ required "pullSecrets[].region is required" .region | quote }}
    secretName: {{ required "pullSecrets[].credentialsSecret is required" .credentialsSecret | quote }}
    secretNamespace: {{ required "pullSecrets[].credentialsNamespace is required" .credentialsNamespace | quote }}
  secretName: {{ required "pullSecrets[].secretName is required" .secretName | quote }}
  namespaces:
    {{- required "pullSecrets[].namespaces is required" .namespaces | toYaml | nindent 4 }}
{{- end }}
